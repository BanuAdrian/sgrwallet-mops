services:
  postgres:
    image: postgres:16-alpine
    container_name: sgrwallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgrwallet}
      POSTGRES_USER: ${POSTGRES_USER:-sgrwallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgrwallet}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - sgrwallet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocr-service:
    build:
      context: ./ocr-service
    container_name: sgrwallet-ocr
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OCR_VISION_MODEL: ${OCR_VISION_MODEL:-gemini-2.5-flash}
    ports:
      - "${OCR_PORT:-8000}:8000"

volumes:
  sgrwallet-postgres-data:
