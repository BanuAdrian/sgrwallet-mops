spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sgrwallet-mops
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/sgrwallet}
    username: ${DB_USERNAME:sgrwallet}
    password: ${DB_PASSWORD:sgrwallet}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
